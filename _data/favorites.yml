# items: one entry per book / video / blog / paper.
#   title, creator, type (book | video | blog | paper) are required.
#   date: when you read/watched it (YYYY-MM-DD; only month + year are shown).
#   status: upnext (queue, no date) or highschool (older reads, no date).
#   Leave out both date and status to list it under "older".
#   link, note: optional. `note` is markdown and shows when the row is clicked.
